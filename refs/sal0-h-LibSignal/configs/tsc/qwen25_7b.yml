includes:
  - configs/tsc/base.yml
  - configs/tsc/od_hub_1800_base.yml

# Level 1 hub-OD inference with Qwen2.5-7B-Instruct hosted locally.
# This is a separate model comparison; the Traffic-R1 config is unchanged.
model:
  name: qwen25_7b
  backend: local

  model_path: "Qwen/Qwen2.5-7B-Instruct"
  # Qwen2.5 stores its config/tokenizer/weights at the repository root.
  model_subfolder: ""
  device_map: "auto"
  torch_dtype: "bfloat16"

  temperature: 0.0
  max_new_tokens: 512
  do_sample: False
  parse_retries: 5

  # Observation (paper-derived four-signal interface).
  v_stop: 0.1
  n_segments: 3
  obs_distance: 200

trainer:
  episodes: 1
  steps: 1800
  test_steps: 1800
  buffer_size: 0
  action_interval: 10
  learning_rate: 0
  learning_start: 0
  update_model_rate: 0
  update_target_rate: 0
  test_when_train: False
  heldout_eval_every: 0

world:
  demand_train_file: raw_data/grid4x4/od_hubs/demand_set/fixed_1800.rou.xml

logger:
  save_rate: 0
