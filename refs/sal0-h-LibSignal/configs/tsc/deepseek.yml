includes:
  - configs/tsc/base.yml
  - configs/tsc/od_hub_1800_base.yml

# Level 1 hub-OD inference with the OpenAI-compatible DeepSeek API.
# This is not the fine-tuned Season998/Traffic-R1 checkpoint.
model:
  name: deepseek
  backend: api

  base_url: "https://genai.qatar.cmu.edu/v1"
  model_id: "deepseek-r1-8b"
  api_key_env: "OPENAI_API_KEY"
  timeout: 180
  # CMU gateway option.
  extra_body:
    use_rag: false

  temperature: 0.0
  # Match the local Traffic-R1 Level-1 evaluation cap.
  max_new_tokens: 512
  do_sample: False
  parse_retries: 5
  # API-only concurrency for the 16 interior requests per decision step.
  parallelism: 16

  # Observation (paper-derived four-signal interface).
  v_stop: 0.1
  n_segments: 3
  obs_distance: 200

trainer:
  episodes: 1
  steps: 1800
  test_steps: 1800
  buffer_size: 0
  action_interval: 10
  learning_rate: 0
  learning_start: 0
  update_model_rate: 0
  update_target_rate: 0
  test_when_train: False
  heldout_eval_every: 0

world:
  demand_train_file: raw_data/grid4x4/od_hubs/demand_set/fixed_1800.rou.xml

logger:
  save_rate: 0
